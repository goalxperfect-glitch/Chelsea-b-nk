<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chelsea Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f3a; --navy2:#13335c; --blue:#1d5fd1; --gold:#f2b632; --bg:#f4f6fb;
  --card:#fff; --text:#0f1b2d; --muted:#64748b; --line:#e2e8f0; --ok:#12805c; --bad:#c2352b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
input{font:inherit}
.hidden{display:none!important}
.demo-bar{background:var(--gold);color:#3b2a00;text-align:center;font-size:12px;font-weight:600;padding:6px 10px}

/* Home */
.demo-bar{background:#06142a;color:#c9a24a;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;border-bottom:1px solid rgba(201,162,74,.25)}
.home{position:relative;min-height:calc(100vh - 29px);background:
  radial-gradient(ellipse at 50% 35%,#14305a 0%,#0a1c38 55%,#061226 100%);
  display:flex;flex-direction:column;color:#fff;overflow:hidden}
.home::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 120px);
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);pointer-events:none}
.home::after{content:"";position:absolute;left:50%;top:-20%;width:140%;height:70%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(201,162,74,.12),transparent 65%);pointer-events:none}
.hnav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:26px clamp(20px,5vw,64px)}
.hmark{font-family:'Playfair Display',serif;font-weight:800;letter-spacing:.2em;font-size:13px;color:#e8d9b0;display:flex;align-items:center;gap:12px}
.hmark i{width:28px;height:28px;border:1.5px solid #c9a24a;display:grid;place-items:center;font-style:normal;color:#c9a24a;font-size:14px;letter-spacing:0}
.hnav button{background:none;color:#e8d9b0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid rgba(201,162,74,.5);padding:6px 0}
.hnav button:hover{color:#fff;border-color:#fff}
.hero{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 70px}
.eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#c9a24a;font-weight:600;animation:rise .9s .05s both}
.brand{font-family:'Playfair Display',serif;font-weight:900;line-height:.92;letter-spacing:.06em;font-size:clamp(46px,12.5vw,150px);margin-top:26px;
  background:linear-gradient(180deg,#fff 20%,#d9e3f5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1s .15s both}
.brand span{display:block;background:linear-gradient(180deg,#f6dc97,#c9a24a 70%,#a8802a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.14em;font-size:.78em;margin-top:.08em}
.rule{width:min(260px,50vw);height:1px;background:linear-gradient(90deg,transparent,#c9a24a,transparent);margin:34px auto 24px;animation:rise 1s .3s both}
.tag{color:#a9b9d3;font-size:clamp(14px,2.2vw,17px);font-weight:400;letter-spacing:.04em;max-width:460px;line-height:1.7;animation:rise 1s .4s both}
.btn{background:linear-gradient(180deg,#f3d98c,#c9a24a);color:#1c1300;font-weight:700;padding:16px 46px;border-radius:2px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(201,162,74,.35);filter:brightness(1.05)}
.btn.blue{background:var(--navy);color:#fff;border-radius:8px;letter-spacing:.02em;text-transform:none;font-size:15px;padding:14px 28px}
.btn.blue:hover{box-shadow:0 10px 24px rgba(11,31,58,.3)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);border-radius:8px;letter-spacing:.02em;text-transform:none;font-size:14px}
.btn.small{padding:11px 22px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.hero .btn{margin-top:40px;animation:rise 1s .55s both}
.hero .link{margin-top:20px;color:#8fa3c4;background:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;animation:rise 1s .65s both}
.hero .link:hover{color:#fff}
.hfoot{position:relative;z-index:2;display:flex;justify-content:center;gap:clamp(16px,5vw,60px);padding:0 20px 28px;color:#6f84a8;font-size:11px;letter-spacing:.24em;text-transform:uppercase;flex-wrap:wrap}
.hfoot span::before{content:"◆ ";color:#c9a24a;font-size:8px;vertical-align:1px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Auth */
.auth{min-height:calc(100vh - 29px);display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#14305a,#0a1c38 70%)}
.panel{background:var(--card);border-radius:6px;border-top:3px solid #c9a24a;padding:38px 34px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(11,31,58,.1)}
.panel h2{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;margin-bottom:6px}
.panel p.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input.f{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none;background:#fff}
input.f:focus{border-color:var(--blue)}
.panel .btn{width:100%;margin-top:22px}
.panel .btn:not(.blue){}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.swap{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.swap button{background:none;color:var(--blue);font-weight:600}

/* App */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1f3a,#09182e);border-bottom:1px solid rgba(201,162,74,.35);color:#fff;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:10px 12px;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.burger i{display:block;width:20px;height:2.5px;background:#fff;border-radius:2px}
.dots{flex-direction:column;gap:4px}
.dots i{display:block;width:5px;height:5px;background:#fff;border-radius:50%}
.balbar{justify-self:center;background:#fff;color:var(--navy);border-radius:999px;padding:10px 26px;font-weight:800;font-family:Archivo,sans-serif;font-size:18px;display:flex;gap:10px;align-items:center;min-width:180px;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.balbar small{font-weight:600;font-size:11px;color:var(--muted);font-family:Inter}
.balbar:hover{background:#fff8e1}
.drop{position:absolute;background:#fff;color:var(--text);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);min-width:230px;padding:8px;z-index:30}
.drop.left{top:62px;left:12px}
.drop.right{top:62px;right:12px}
.drop.mid{top:66px;left:50%;transform:translateX(-50%)}
.drop button{display:block;width:100%;text-align:left;background:none;padding:12px 14px;border-radius:9px;font-size:15px;font-weight:500;color:var(--text)}
.drop button:hover{background:var(--bg)}
.drop .sep{height:1px;background:var(--line);margin:6px 0}
.drop .lbl{font-size:11px;font-weight:700;color:var(--muted);padding:8px 14px 4px;text-transform:uppercase;letter-spacing:.06em}
.drop .acc-cur{font-weight:700}
.main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
.hello{font-family:'Playfair Display',serif;font-weight:800;font-size:28px}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.badge{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.badge.free{background:#94a3b8}.badge.premium{background:var(--gold);color:#3b2a00}
.card{background:var(--card);border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 4px 20px rgba(11,31,58,.06)}
.big{font-family:Archivo,sans-serif;font-weight:900;font-size:44px;margin-top:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.row .btn{flex:1;min-width:140px;margin:0;width:auto}
.lock{background:#fff7e6;border:1.5px dashed var(--gold);padding:18px;border-radius:12px;margin-top:14px;font-size:14px}
.lock .btn{margin-top:12px;width:auto}
.tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx:last-child{border:0}.tx .plus{color:var(--ok);font-weight:700}.tx .minus{color:var(--bad);font-weight:700}
.back{background:none;color:var(--blue);font-weight:600;margin-bottom:6px;font-size:14px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick button{background:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px}
.quick button:hover{background:#e6ecf7}

/* Plans modal */
.overlay{position:fixed;inset:0;background:rgba(5,15,30,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:20px;padding:26px;max-width:820px;width:100%}
.modal h3{font-family:Archivo,sans-serif;font-weight:800;font-size:24px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}
.plan{border:2px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column}
.plan.cur{border-color:var(--blue);background:#f3f7ff}
.plan h4{font-family:Archivo,sans-serif;font-size:18px;font-weight:800}
.plan .price{font-size:34px;font-weight:900;font-family:Archivo,sans-serif;margin:8px 0}
.plan .price small{font-size:13px;color:var(--muted);font-weight:500}
.plan ul{list-style:none;font-size:14px;color:#334155;flex:1}
.plan li{padding:5px 0}
.plan li.no{color:#94a3b8;text-decoration:line-through}
.plan li::before{content:"✓ ";color:var(--ok);font-weight:700}
.plan li.no::before{content:"✕ ";color:var(--bad)}
.plan .btn{width:100%;margin-top:14px}
.fine{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.idbox{background:var(--bg);border-radius:10px;padding:12px 14px;font-family:ui-monospace,monospace;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="demo-bar">DEMO ONLY — no real money, no real transfers. Everything here is simulated.</div>
<div id="app"></div>
<div id="layer"></div>

<script>
/* ---------- storage (safe) ---------- */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null ? (mem[k]??null) : v; }catch(e){ return mem[k]??null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
let db;
try{ db = JSON.parse(store.get('chelsea-demo')||'null'); }catch(e){ db=null; }
if(!db || !Array.isArray(db.accounts)) db = {accounts:[], current:null};
const save = () => store.set('chelsea-demo', JSON.stringify(db));

const PLANS = {
  free:{name:'Free',price:0,add:false,send:false},
  standard:{name:'Standard',price:49,add:true,send:false},
  premium:{name:'Premium',price:99,add:true,send:true}
};

let view = 'home';          // home | signup | login | dash | add | send | settings
let addingAccount = false;
let openMenu = null;        // 'left' | 'mid' | 'right' | null

const $ = s => document.querySelector(s);
const cur = () => db.accounts.find(a=>a.id===db.current);
const money = n => '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function newId(){ let id; do{ id='CB-'+Math.floor(100000+Math.random()*900000);}while(db.accounts.some(a=>a.id===id)); return id; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function go(v){ view=v; openMenu=null; render(); window.scrollTo(0,0); }
function log(acc,text,amt){ acc.tx = acc.tx||[]; acc.tx.unshift({text,amt,t:new Date().toLocaleString()}); acc.tx = acc.tx.slice(0,30); }

/* ---------- render ---------- */
function render(){
  const app = $('#app');
  if(view==='dash'||view==='add'||view==='send'||view==='settings'){ if(!cur()){ view='home'; } }
  if(view==='home') app.innerHTML = homeHTML();
  else if(view==='signup') app.innerHTML = authHTML(true);
  else if(view==='login') app.innerHTML = authHTML(false);
  else app.innerHTML = appHTML();
}

function homeHTML(){
  return `<div class="home">
    <nav class="hnav"><div class="hmark"><i>C</i>CHELSEA BANK</div>
      <button onclick="go('${db.accounts.length?'login':'signup'}')">${db.accounts.length?'Log in':'Sign up'}</button></nav>
    <section class="hero">
      <div class="eyebrow">Private · Secure · Simple</div>
      <h1 class="brand">CHELSEA<span>BANK</span></h1>
      <div class="rule"></div>
      <p class="tag">Banking, refined. Open an account in seconds and manage your money with calm and clarity.</p>
      <button class="btn" onclick="addingAccount=false;go('signup')">Sign Up</button>
      ${db.accounts.length?`<button class="link" onclick="go('login')">I already have an account</button>`:''}
    </section>
    <div class="hfoot"><span>Bank-grade design</span><span>Instant accounts</span><span>Demo edition</span></div>
  </div>`;
}

function authHTML(isSignup){
  return `<div class="auth"><form class="panel" onsubmit="return submitAuth(event,${isSignup})">
    <h2>${isSignup?(addingAccount?'Add new account':'Create your account'):'Welcome back'}</h2>
    <p class="sub">${isSignup?'Enter an email and password to get started.':'Log in with your email and password.'}</p>
    <label for="em">Email</label><input class="f" id="em" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="pw">Password</label><input class="f" id="pw" type="password" required minlength="4" autocomplete="${isSignup?'new-password':'current-password'}" placeholder="At least 4 characters">
    <div class="err" id="err"></div>
    <button class="btn blue" type="submit">${isSignup?'Sign Up':'Log In'}</button>
    <div class="swap">${isSignup?
      `${addingAccount?`<button type="button" onclick="addingAccount=false;go('dash')">Cancel</button> · `:''}Have an account? <button type="button" onclick="go('login')">Log in</button>`:
      `New here? <button type="button" onclick="go('signup')">Sign up</button> · <button type="button" onclick="go('home')">Back</button>`}</div>
    <p class="fine">Demo: details are stored only in this browser.</p>
  </form></div>`;
}

function submitAuth(e,isSignup){
  e.preventDefault();
  const email=$('#em').value.trim().toLowerCase(), pw=$('#pw').value;
  const err=$('#err');
  if(isSignup){
    if(db.accounts.some(a=>a.email===email)){ err.textContent='That email already has an account. Try logging in.'; return false; }
    const acc={id:newId(),email,pass:pw,name:email.split('@')[0],balance:0,plan:'free',tx:[]};
    db.accounts.push(acc); db.current=acc.id; save();
    addingAccount=false; toast('Account created — Free plan'); go('dash');
  }else{
    const acc=db.accounts.find(a=>a.email===email&&a.pass===pw);
    if(!acc){ err.textContent='Wrong email or password.'; return false; }
    db.current=acc.id; save(); go('dash');
  }
  return false;
}

function appHTML(){
  const a=cur(), p=PLANS[a.plan];
  let body='';
  if(view==='dash') body=dashHTML(a);
  if(view==='add') body=addHTML(a);
  if(view==='send') body=sendHTML(a);
  if(view==='settings') body=settingsHTML(a);
  return `
  <div class="topbar">
    <button class="icon-btn burger" aria-label="Menu" onclick="toggleMenu('left',event)"><i></i><i></i><i></i></button>
    <button class="balbar" onclick="toggleMenu('mid',event)" aria-label="Balance"><small>BALANCE</small>${money(a.balance)}</button>
    <button class="icon-btn dots" aria-label="More" onclick="toggleMenu('right',event)" style="justify-self:end"><i></i><i></i><i></i></button>
    ${menuHTML(a)}
  </div>
  <div class="main" onclick="if(openMenu){openMenu=null;render()}">${body}</div>`;
}

function menuHTML(a){
  if(openMenu==='left'){
    const others=db.accounts.filter(x=>x.id!==a.id);
    return `<div class="drop left" onclick="event.stopPropagation()">
      <div class="lbl">Signed in as</div>
      <button class="acc-cur" onclick="go('dash')">${esc(a.email)}</button>
      <div class="sep"></div>
      <button onclick="addingAccount=true;go('signup')">＋ Add new account</button>
      <button onclick="go('settings')">⚙ Manage settings</button>
      ${others.length?`<div class="sep"></div><div class="lbl">Switch account</div>`+others.map(o=>`<button onclick="switchTo('${o.id}')">${esc(o.email)}</button>`).join(''):''}
      <div class="sep"></div>
      <button onclick="logout()" style="color:var(--bad)">⎋ Log out</button>
    </div>`;
  }
  if(openMenu==='mid'){
    return `<div class="drop mid" onclick="event.stopPropagation()">
      <button onclick="go('add')">＋ Add balance</button>
      <button onclick="go('send')">➤ Send money</button>
    </div>`;
  }
  if(openMenu==='right'){
    return `<div class="drop right" onclick="event.stopPropagation()">
      <button onclick="openPlans()">★ Change plan</button>
      <button onclick="go('dash')">⌂ Dashboard</button>
    </div>`;
  }
  return '';
}
function toggleMenu(which,e){ e.stopPropagation(); openMenu = openMenu===which?null:which; render(); }
function switchTo(id){ db.current=id; save(); toast('Switched account'); go('dash'); }
function logout(){ db.current=null; save(); toast('Logged out'); go('home'); }

function planBadge(a){ return `<span class="badge ${a.plan}">${PLANS[a.plan].name}</span>`; }

function dashHTML(a){
  const tx=(a.tx||[]);
  return `<div class="hello">Hi, ${esc(a.name)} ${planBadge(a)}</div>
  <div class="meta">Account ID: ${a.id}</div>
  <div class="card"><div class="meta">Available balance</div><div class="big">${money(a.balance)}</div>
    <div class="row">
      <button class="btn blue small" onclick="go('add')">Add balance</button>
      <button class="btn ghost small" onclick="go('send')">Send money</button>
    </div>
    ${a.plan==='free'?`<div class="lock">You're on the <b>Free</b> plan — features are locked. Upgrade to use them.<br><button class="btn small" onclick="openPlans()">See plans</button></div>`:''}
  </div>
  <div class="card"><b>Recent activity</b>
    ${tx.length?tx.map(t=>`<div class="tx"><span>${esc(t.text)}<br><small style="color:var(--muted)">${t.t}</small></span><span class="${t.amt>=0?'plus':'minus'}">${t.amt>=0?'+':'−'}${money(Math.abs(t.amt))}</span></div>`).join(''):`<p class="meta" style="margin-top:10px">No activity yet.</p>`}
  </div>`;
}

function lockHTML(need){
  return `<div class="lock"><b>🔒 Locked on your plan.</b><br>${need==='add'?'Adding balance needs the Standard ($49) or Premium ($99) plan.':'Sending money needs the Premium plan ($99).'}<br><button class="btn small" onclick="openPlans()">Change plan</button></div>`;
}

function addHTML(a){
  const ok=PLANS[a.plan].add;
  return `<button class="back" onclick="go('dash')">← Back</button>
  <div class="card" style="margin-top:6px"><h2 class="hello" style="font-size:24px">Add balance</h2>
  <p class="meta">Current balance: ${money(a.balance)} · virtual money only</p>
  ${ok?`<form onsubmit="return doAdd(event)">
    <label for="amt">How much do you want to add? ($)</label>
    <input class="f" id="amt" type="number" min="0.01" max="1000000" step="0.01" required placeholder="0.00" inputmode="decimal">
    <div class="quick">${[10,50,100,500,1000].map(n=>`<button type="button" onclick="$('#amt').value=${n}">$${n}</button>`).join('')}</div>
    <div class="err" id="err"></div>
    <button class="btn blue" type="submit" style="width:100%;margin-top:14px">Add to balance</button></form>`:lockHTML('add')}
  </div>`;
}
function doAdd(e){
  e.preventDefault(); const a=cur(); const v=Math.round(parseFloat($('#amt').value)*100)/100;
  if(!(v>0)||v>1000000){ $('#err').textContent='Enter an amount between $0.01 and $1,000,000.'; return false; }
  if(!PLANS[a.plan].add) return false;
  a.balance=Math.round((a.balance+v)*100)/100; log(a,'Added balance (demo)',v); save();
  toast(money(v)+' added'); go('dash'); return false;
}

function sendHTML(a){
  const ok=PLANS[a.plan].send;
  return `<button class="back" onclick="go('dash')">← Back</button>
  <div class="card" style="margin-top:6px"><h2 class="hello" style="font-size:24px">Send money</h2>
  <p class="meta">Current balance: ${money(a.balance)} · simulated transfer, nothing real moves</p>
  ${ok?`<form onsubmit="return doSend(event)">
    <label for="sid">Sender ID (your ID)</label>
    <input class="f" id="sid" required placeholder="${a.id}" autocomplete="off">
    <label for="rid">Receiver ID</label>
    <input class="f" id="rid" required placeholder="e.g. CB-123456" autocomplete="off">
    <label for="samt">Amount ($)</label>
    <input class="f" id="samt" type="number" min="0.01" step="0.01" required placeholder="0.00" inputmode="decimal">
    <div class="err" id="err"></div>
    <button class="btn blue" type="submit" style="width:100%">Send (demo)</button>
    <p class="fine">Your ID is <b>${a.id}</b>. Send to another account's ID from this browser to see it arrive, or to any ID to simulate an outside recipient.</p>
  </form>`:lockHTML('send')}
  </div>`;
}
function doSend(e){
  e.preventDefault(); const a=cur(); const err=$('#err');
  const sid=$('#sid').value.trim().toUpperCase(), rid=$('#rid').value.trim().toUpperCase();
  const v=Math.round(parseFloat($('#samt').value)*100)/100;
  if(!PLANS[a.plan].send) return false;
  if(sid!==a.id){ err.textContent='Sender ID must match your account ID ('+a.id+').'; return false; }
  if(!rid){ err.textContent='Enter the receiver ID.'; return false; }
  if(rid===a.id){ err.textContent="You can't send money to yourself."; return false; }
  if(!(v>0)){ err.textContent='Enter a valid amount.'; return false; }
  if(v>a.balance){ err.textContent='Not enough balance. Add balance first.'; return false; }
  a.balance=Math.round((a.balance-v)*100)/100; log(a,'Sent to '+rid+' (demo)',-v);
  const r=db.accounts.find(x=>x.id===rid);
  if(r){ r.balance=Math.round((r.balance+v)*100)/100; log(r,'Received from '+a.id+' (demo)',v); }
  save(); toast(money(v)+' sent to '+rid); go('dash'); return false;
}

function settingsHTML(a){
  return `<button class="back" onclick="go('dash')">← Back</button>
  <div class="card" style="margin-top:6px"><h2 class="hello" style="font-size:24px">Manage settings</h2>
    <label>Account ID</label><div class="idbox">${a.id}</div>
    <label>Email</label><div class="idbox" style="font-family:Inter">${esc(a.email)}</div>
    <label>Plan</label><div class="idbox" style="font-family:Inter">${PLANS[a.plan].name}${PLANS[a.plan].price?' — $'+PLANS[a.plan].price:''}<button class="btn small blue" style="padding:6px 14px" onclick="openPlans()">Change</button></div>
    <form onsubmit="return saveSettings(event)">
      <label for="nm">Display name</label><input class="f" id="nm" value="${esc(a.name)}" required maxlength="30">
      <label for="np">New password (optional)</label><input class="f" id="np" type="password" minlength="4" placeholder="Leave blank to keep current">
      <div class="err" id="err"></div>
      <button class="btn blue" type="submit">Save changes</button>
    </form>
    <button class="btn ghost small" style="width:100%;margin-top:14px;color:var(--bad);border-color:var(--bad)" onclick="deleteAcc()">Delete this account</button>
  </div>`;
}
function saveSettings(e){
  e.preventDefault(); const a=cur();
  a.name=$('#nm').value.trim()||a.name; const np=$('#np').value; if(np) a.pass=np;
  save(); toast('Settings saved'); go('dash'); return false;
}
function deleteAcc(){
  confirmBox('Delete this account? This only removes the demo data in this browser.',()=>{
    db.accounts=db.accounts.filter(x=>x.id!==db.current); db.current=null; save(); go('home');
  });
}

/* ---------- modals ---------- */
function closeLayer(){ $('#layer').innerHTML=''; }
function confirmBox(msg,yes){
  $('#layer').innerHTML=`<div class="overlay"><div class="modal" style="max-width:380px"><h3>Are you sure?</h3><p class="meta" style="margin:10px 0 18px">${esc(msg)}</p>
  <div class="row" style="margin:0"><button class="btn ghost small" id="cn">Cancel</button><button class="btn blue small" id="cy">Confirm</button></div></div></div>`;
  $('#cn').onclick=closeLayer; $('#cy').onclick=()=>{closeLayer();yes();};
}
function openPlans(){
  openMenu=null; render();
  const a=cur();
  const card=(k,feats)=>{ const p=PLANS[k]; const isCur=a.plan===k;
    return `<div class="plan ${isCur?'cur':''}"><h4>${p.name}</h4><div class="price">$${p.price}<small> /month</small></div>
    <ul>${feats.map(([t,y])=>`<li class="${y?'':'no'}">${t}</li>`).join('')}</ul>
    <button class="btn ${isCur?'ghost':'blue'} small" ${isCur?'disabled':''} onclick="pickPlan('${k}')">${isCur?'Current plan':'Choose '+p.name}</button></div>`; };
  $('#layer').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeLayer()"><div class="modal">
    <h3>Change plan</h3><p class="meta">Pick the plan that fits you. This is a demo — you won't be charged.</p>
    <div class="plans">
      ${card('free',[['Sign up',true],['Add balance',false],['Send money',false]])}
      ${card('standard',[['Sign up',true],['Add balance',true],['Send money',false]])}
      ${card('premium',[['Sign up',true],['Add balance',true],['Send money',true],['Every feature',true]])}
    </div>
    <p class="fine">No real payment is taken. Plan prices are for show only.</p>
    <div class="row" style="margin-top:14px"><button class="btn ghost small" onclick="closeLayer()">Close</button></div>
  </div></div>`;
}
function pickPlan(k){
  const a=cur(); a.plan=k; save(); closeLayer(); toast('Plan changed to '+PLANS[k].name+' (demo)'); render();
}

render();
</script>
</body>
</html>
